plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def benchmarkLabel = providers.gradleProperty('benchmarkLabel').orElse('current').get()
if (!(benchmarkLabel ==~ /[a-zA-Z0-9_-]+/)) {
    throw new GradleException('benchmarkLabel must contain only letters, numbers, underscores or hyphens.')
}

repositories {
    maven { url = 'https://cursemaven.com' }
    mavenCentral()
}

// A local copy is optional. It is never bundled into The Null.
def localSiftJar = file('libs/Sift-Backport-1.0.3.0-26.3-fabric.jar')
def siftArtifact = localSiftJar.exists()
    ? files(localSiftJar)
    : 'curse.maven:sift-backport-1714907:9045257'

configurations {
    siftOverlayInput
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation siftArtifact
    siftOverlayInput siftArtifact
}

// Build a tiny resource override from the selected Sift Backport jar. The
// original mod jar is only read as an input; it is not redistributed here.
def generatedSiftResources = layout.buildDirectory.dir('generated/sift-overlay')
sourceSets {
    main {
        resources.srcDir(generatedSiftResources)
    }
}

apply from: 'gradle/sift-overlay.gradle'

tasks.named('processResources') {
    dependsOn tasks.named('generateSiftOverlay')
    inputs.property('version', project.version)
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

sourceSets {
    verification {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    clientVerification {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    mods {
        thenull { sourceSet sourceSets.main }
        thenull_verification { sourceSet sourceSets.verification }
        thenull_client_verification { sourceSet sourceSets.clientVerification }
    }
    runs {
        verificationServer {
            server()
            name 'The Null disposable verification server'
            source sourceSets.verification
            runDir 'runs/verification'
            vmArg '-Dthenull.verificationReport=../../build/reports/verification.txt'
            programArg 'nogui'
        }
        performanceServer {
            server()
            name 'The Null disposable performance server'
            source sourceSets.verification
            runDir 'runs/performance'
            vmArg '-Xmx2G'
            vmArg '-Dthenull.benchmark=true'
            vmArg "-Dthenull.benchmarkLabel=${benchmarkLabel}"
            programArg 'nogui'
        }
        clientVerification {
            client()
            name 'The Null disposable client verification'
            source sourceSets.clientVerification
            runDir 'runs/client-verification'
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=thenull_client_verification'
            vmArg '-Dthenull.clientVerificationReport=../../build/reports/client-verification.txt'
        }
        clientPerformance {
            client()
            name 'The Null three-location client performance comparison'
            source sourceSets.clientVerification
            runDir 'runs/client-performance'
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=thenull_client_verification'
            vmArg '-Dthenull.clientPerformance=true'
            vmArg '-Dthenull.clientVerificationReport=../../build/reports/client-performance.txt'
        }
    }
}

apply from: 'gradle/verification.gradle'
apply from: 'gradle/packaged-verification.gradle'
apply from: 'gradle/performance-comparison.gradle'

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('sourcesJar') {
    dependsOn tasks.named('generateSiftOverlay')
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    from('NOTICE') {
        into('META-INF')
    }
    from('docs/THIRD_PARTY.md') {
        into('META-INF')
    }
}
