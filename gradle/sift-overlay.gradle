/*
 * The Null's isolated Sift Backport compatibility layer.
 * AI-assisted implementation, Apache-2.0; generated Sift data derives from
 * Sift Backport 1.0.3.0 (MIT, author DerexXD in its Fabric metadata).
 * The dependency JAR, classes, textures and other assets are never copied.
 */
import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.util.zip.ZipFile

def outputDirectory = layout.buildDirectory.dir('generated/sift-overlay')

tasks.register('generateSiftOverlay') {
    group = 'build'
    description = 'Generate an always-enabled, high-priority Sift dimension extension pack.'
    inputs.files(configurations.siftOverlayInput)
    inputs.file(file('gradle/sift-overlay.gradle'))
    // Verified from Minecraft 26.3 version.json: data_major=121, data_minor=0.
    inputs.property('dataPackFormat', providers.gradleProperty('null_datapack_format').orElse('121'))
    outputs.dir(outputDirectory)

    doLast {
        def siftJars = configurations.siftOverlayInput.files.findAll { it.name.endsWith('.jar') }
        if (siftJars.size() != 1) {
            throw new GradleException("Expected exactly one Sift Backport input JAR, got ${siftJars.size()}")
        }
        def parser = new JsonSlurper()
        def dimensionType
        def noiseSettings
        def metadata
        new ZipFile(siftJars.first()).withCloseable { archive ->
            def readJson = { String path ->
                def entry = archive.getEntry(path)
                if (entry == null) {
                    throw new GradleException("Sift compatibility input is missing ${path}")
                }
                archive.getInputStream(entry).withCloseable { stream -> parser.parse(stream, 'UTF-8') }
            }
            metadata = readJson('fabric.mod.json')
            if (metadata.id != 'sift_backport' || metadata.version != '1.0.3.0'
                    || metadata.depends?.minecraft != '~26.3') {
                throw new GradleException('Unsupported Sift Backport version; review the compatibility layer before updating it.')
            }
            dimensionType = readJson('data/sift/dimension_type/sift.json')
            noiseSettings = readJson('data/sift/worldgen/noise_settings/sift.json')
        }
        if (dimensionType.min_y != 0 || dimensionType.height != 256 || dimensionType.logical_height != 256
                || noiseSettings.noise?.min_y != 0 || noiseSettings.noise?.height != 256
                || noiseSettings.default_fluid != 'minecraft:air'
                || noiseSettings.material_rule != 'sift:sift'
                || !(noiseSettings.noise_router?.final_density instanceof Map)) {
            throw new GradleException('Sift worldgen schema/height changed; refusing an unreviewed lower-world override.')
        }

        // Keep Sift's original 0..255 generator, sea level, surface rules and
        // density functions. The bounded Java terrain pass adds only Y<0.
        // Expanding noise sampling to 1024 blocks caused measured chunk stalls.
        dimensionType.min_y = -768
        dimensionType.height = 1024
        dimensionType.logical_height = 1024
        // Keep Sift's skylight, ambient light and visual attributes. Independent
        // darkness below Y=0 is a documented prototype limitation.

        def generatedRoot = outputDirectory.get().asFile
        delete(generatedRoot)
        def packRoot = new File(generatedRoot, 'resourcepacks/null_extension')
        def writeJson = { String path, value ->
            def destination = new File(packRoot, path)
            destination.parentFile.mkdirs()
            destination.setText(JsonOutput.prettyPrint(JsonOutput.toJson(value)) + '\n', 'UTF-8')
        }
        def packFormat = providers.gradleProperty('null_datapack_format').orElse('121').get().toInteger()
        writeJson('pack.mcmeta', [pack: [description: 'The Null: lower Sift terrain prototype',
                                     min_format: packFormat, max_format: packFormat]])
        writeJson('data/sift/dimension_type/sift.json', dimensionType)
        new File(packRoot, 'SIFT_ATTRIBUTION.txt').setText(
                'Adapted world-generation JSON from Sift Backport 1.0.3.0 by DerexXD.\n' +
                'Upstream Fabric metadata identifies the license as MIT.\n' +
                'Source: https://github.com/Derec-Mods/Sift-Backport/tree/main/fabric/26.3\n' +
                'The input JAR does not contain a license file or copyright notice.\n' +
                'No upstream Java classes, textures, or complete mod JAR are included.\n', 'UTF-8')
        logger.lifecycle("Generated Sift extension pack at ${packRoot}")
    }
}
